<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workload Analyzer UI</title>
    <!-- Pre-paint theme (FR-DS-003). The only inline script; its CSP hash is kept in
         src/app/theme/theme-bootstrap.ts and asserted by theme-bootstrap.test.ts. -->
    <script>(function(){try{var t=localStorage.getItem('ui.theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.add(t==='light'||t==='dark'?t:(d?'dark':'light'))}catch(e){}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
